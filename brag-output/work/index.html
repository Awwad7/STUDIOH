const cursor = el('div', null, null, `<svg viewBox="0 0 24 24" width="52" height="52"><path d="M4.5 2.5 L4.5 19.5 L9 15.3 L12 22 L15 20.7 L12.1 14.2 L18.5 14.2 Z" fill="#fff" stroke="#05060C" stroke-width="1.3" stroke-linejoin="round"/></svg>`);
cursor.id = 'cursor';
const ripple = el('div'); ripple.id = 'ripple';
// [time, x, y] keyframes and click times per scene
const CUR = [
  { k: [[12.2, 1760, 1060], [12.95, 1290, 380]], clicks: [13.11], end: 13.38 },
  { k: [[17.45, 1760, 1060], [17.78, DOC_X[0] + 250, 780], [18.08, DOC_X[1] + 250, 780], [18.44, DOC_X[2] + 250, 780], [19.2, DOC_X[2] + 330, 860]], clicks: CLICK6, end: 19.4 },
  { k: [[21.55, 1560, 1060], [22.55, 1168, 674]], clicks: [22.93], end: 99 },
];
function cursorAt(t) {
  for (const c of CUR) {
    const t0 = c.k[0][0];
    if (t < t0 || t > c.end) continue;
    let x = c.k[0][1], y = c.k[0][2];
    for (let i = 1; i < c.k.length; i++) {
      const [ta, xa, ya] = c.k[i - 1], [tb, xb, yb] = c.k[i];
      if (t >= ta) { const q = eio(P(t, ta, tb)); x = L(xa, xb, q); y = L(ya, yb, q); }
    }
    const o = P(t, t0, t0 + .2) * (1 - P(t, c.end - .15, c.end));
    let press = 0, rip = null;
    for (const ct of c.clicks) {
      press = Math.max(press, 1 - Math.abs(t - ct - .03) / .09);
      if (t >= ct && t < ct + .5) rip = P(t, ct, ct + .5);
    }
    return { x, y, o, press: C(press), rip };
  }
  return null;
}

// ---------- render ----------
window.render = function (t) {
  const fi = Math.min(RMS.length - 1, Math.max(0, Math.round(t * 30)));
  const rms = RMS[fi];
  let si = SC.findIndex(([a, b]) => t >= a && t < b);
  if (si < 0) si = SC.length - 1;
  scenes.forEach((sc, i) => {
    const [a, b] = SC[i];
    if (i !== si) { sc.style.opacity = 0; sc.style.visibility = 'hidden'; return; }
    sc.style.visibility = 'visible';
    const x = i === SC.length - 1 ? 0 : eio(P(t, b - .26, b));
    S(sc, { o: 1 - x, y: -18 * x, blur: 5 * x });
  });

  // glow: follow scene focus, breathe with the music, flash on reveals
  const [ga, gb] = [GLOW[Math.max(0, si - 1)], GLOW[si]];
  const gq = eio(P(t, SC[si][0], SC[si][0] + .6));
  const flash = Math.max(Math.exp(-Math.max(0, t - 4.39) * 3) * (t >= 4.39 ? 1 : 0), Math.exp(-Math.max(0, t - 20.75) * 3) * (t >= 20.75 ? .7 : 0));
  const glow = document.getElementById('glow');
  glow.style.left = L(ga[0], gb[0], gq) + 'px'; glow.style.top = L(ga[1], gb[1], gq) + 'px';
  glow.style.opacity = C(.62 + .32 * rms + .45 * flash, 0, 1.3);
  glow.style.transform = `scale(${1 + .05 * rms + .08 * flash})`;

  // corner logo: hidden where the big logo is on screen
  const cornerOn = (t < 4.2) || (t >= 7.09 && t < 19.5);
  const cornerK = t < 4.39 ? P(t, 0, .4) * (1 - P(t, 4.1, 4.3)) : P(t, 7.1, 7.5) * (1 - P(t, 19.3, 19.6));
  S(corner, { o: cornerOn ? cornerK * .9 : 0 });

  // ----- scene 1
  if (si === 0) {
    const k1 = eo(P(t, .15, .55)); S(h1a, { o: k1, y: (1 - k1) * 30, s: L(1.06, 1, k1) });
    rise(h1b, t, 1.9, .45);
    S(br, { o: eo(P(t, .05, .4)) * L(1, .5, eo(P(t, 1.9, 2.4))), y: (1 - eo(P(t, .05, .5))) * 40 });
    let nEff = 0; const ks = TAB_T.map(ta => { const k = eo(P(t, ta, ta + .18)); nEff += k; return k; });
    const w = Math.min(250, 1250 / Math.max(1, nEff));
    let xx = 100, active = -1;
    tabs.forEach((tb, i) => {
      const k = ks[i]; if (k > .5) active = i;
      tb.style.left = xx + 'px'; tb.style.width = Math.max(0, w * k - 2) + 'px'; tb.style.opacity = k;
      xx += w * k;
    });
    tabs.forEach((tb, i) => { tb.style.background = i === active ? '#0F141D' : 'transparent'; tb.style.padding = w < 90 ? '0 10px' : '0 14px'; });
    badge.textContent = ks.filter(k => k > .5).length;
    const bk = TAB_T.findLastIndex(ta => t >= ta);
    badge.style.transform = `scale(${1 + .18 * Math.max(0, 1 - (t - (TAB_T[bk] ?? -9)) / .15)})`;
    const r = rng(3 + Math.max(0, active));
    skel.forEach(s => { s.style.width = 120 + r() * 140 + 'px'; });
    jobRows.forEach(([a, b]) => { a.style.width = 280 + r() * 380 + 'px'; b.style.width = 180 + r() * 260 + 'px'; });
    const rk = eo(P(t, 1.85, 2.3));
    S(resWrap, { o: rk, x: (1 - rk) * 220, r: -3 * rk });
    const fidx = FILE_T.findLastIndex(ft => t >= ft);
    fname.textContent = FILES[Math.max(0, fidx)];
    const fPulse = fidx >= 0 ? Math.max(0, 1 - (t - FILE_T[fidx]) / .2) : 0;
    fname.style.borderColor = `rgba(94,232,212,${.1 + .6 * fPulse})`;
    fname.style.transform = `scale(${1 + .05 * fPulse})`;
    const rr = rng(20 + Math.max(0, fidx));
    res1Lines.forEach((ln, i) => {
      ln.style.width = 35 + rr() * 65 + '%';
      const hot = fPulse > 0 && (i + fidx) % 4 === 0;
      ln.style.background = hot ? `rgba(94,232,212,${.25 + .5 * fPulse})` : 'rgba(255,255,255,.12)';
    });
  }

  // ----- scene 2
  if (si === 1) {
    pop(lg2tile, t, 4.39, .45);
    lg2word.forEach(w => { const k = eo(P(t, 4.47, 4.85)); S(w, { o: k, x: (1 - k) * -30 }); });
    const a = eo(P(t, 4.62, 5.0)); S(h2a, { o: a, y: (1 - a) * 36, blur: (1 - a) * 8 });
    const b = eo(P(t, 5.15, 5.55)); S(h2b, { o: b, y: (1 - b) * 36, blur: (1 - b) * 8 });
  }

  // ----- scene 3
  if (si === 2) {
    rise(e3, t, 7.12); rise(h3, t, 7.2);
    const zk = eo(P(t, 7.14, 7.45)); S(zone, { o: zk, s: L(.97, 1, zk) });
    const land = P(t, 7.25, 7.64);
    S(res3, { o: C(land * 4), y: (1 - eb(land)) * -380, r: (1 - eo(land)) * -6 });
    const landed = t >= 7.64;
    zone.style.borderStyle = landed ? 'solid' : 'dashed';
    zone.style.borderColor = landed ? `rgba(94,232,212,${.25 + .5 * Math.max(0, 1 - (t - 7.64) / .5)})` : 'rgba(94,232,212,.4)';
    zoneLbl.style.opacity = 1 - P(t, 7.55, 7.7);
    const sk = P(t, 7.78, 8.55);
    scan.style.opacity = sk > 0 && sk < 1 ? 1 : 0;
    scan.style.top = L(345, 835, eio(sk)) + 'px';
    res3Lines.forEach((ln, i) => {
      const ly = 335 + 116 + i * 24;
      const past = L(345, 835, eio(sk)) > ly && sk > 0;
      ln.style.background = past ? 'rgba(94,232,212,.32)' : 'rgba(255,255,255,.12)';
    });
    rise(chipHd, t, 8.05, .4, 14);
    chips.forEach((c, i) => pop(c, t, 8.2 + i * .17, .38));
    rise(lock3, t, 8.1, .45, 18);
  }

  // ----- scene 4
  if (si === 3) {
    rise(e4, t, 10.4); rise(h4, t, 10.48);
    const ck = eio(P(t, 10.55, 11.5));
    rise(cnt4, t, 10.55, .4, 14);
    c4a.textContent = ck >= 1 ? '2,000,000+' : fmt(2000000 * ck);
    c4b.textContent = fmt(45000 * ck);
    rows.forEach((r, i) => {
      const k = eo(P(t, 10.7 + i * .12, 11.1 + i * .12));
      const sel = i === 0 ? eo(P(t, 13.11, 13.3)) : 0;
      S(r.e, { o: k, x: (1 - k) * 60, s: 1 + .02 * sel });
      const f = eo(P(t, 11.0 + i * .1, 11.8 + i * .1));
      r.fill.style.width = r.v * f + '%';
      r.n.textContent = Math.round(r.v * f);
      r.e.style.borderColor = i === 0 ? `rgba(94,232,212,${.25 + .6 * sel})` : 'rgba(255,255,255,.07)';
      r.e.style.background = i === 0 ? `rgba(${L(12, 16, sel)},${L(16, 36, sel)},${L(24, 38, sel)},1)` : '#0C1018';
      r.e.style.boxShadow = i === 0 ? `0 0 ${50 * sel}px rgba(94,232,212,${.22 * sel})` : 'none';
    });
    const tk = eo(P(t, 12.0, 12.35)); S(top4, { o: tk, s: L(.8, 1, tk) });
  }

  // ----- scene 5
  if (si === 4) {
    rise(e5, t, 13.67); rise(h5, t, 13.75);
    const ck = eo(P(t, 13.82, 14.25)); S(card5, { o: ck, s: L(.94, 1, ck), y: (1 - ck) * 20 });
    score5.textContent = Math.round(94 * eo(P(t, 13.95, 14.75)));
    bars5.forEach((b, i) => {
      rise(b.e, t, 13.92 + i * .1, .35, 18);
      const f = eo(P(t, 14.0 + i * .12, 14.6 + i * .12));
      b.fill.style.width = b.val * f + '%'; b.v.textContent = Math.round(b.val * f);
    });
    rise(pay5, t, 14.9, .45, 20);
  }

  // ----- scene 6
  if (si === 5) {
    rise(e6, t, 16.96); rise(h6, t, 17.04);
    docs.forEach((d, i) => {
      const k = P(t, 17.1 + i * .06, 17.47 + i * .04);
      const e = eo(k);
      S(d.e, { o: C(k * 3), x: (DOC_X[1] - DOC_X[i]) * (1 - e), y: 70 * (1 - e), r: (i - 1) * 9 * (1 - e), s: L(.9, 1, e) });
      const done = t >= CLICK6[i];
      const pk = done ? Math.max(0, 1 - (t - CLICK6[i]) / .25) : 0;
      d.b.style.background = done ? '#5EE8D4' : 'transparent';
      d.b.style.color = done ? '#05110F' : '#5EE8D4';
      d.b.style.transform = `scale(${1 - .04 * pk})`;
      d.b.innerHTML = done ? ICON.check('#05110F') + '<span>downloaded</span>' : ICON.down('#5EE8D4') + `<span>download ${d.ext}</span>`;
    });
    rise(toast, t, 18.66, .35, 24);
  }

  // ----- scene 7
  if (si === 6) {
    pop(lg7.children[0], t, 19.72, .45);
    [lg7.children[1], lg7.children[2]].forEach(w => { const k = eo(P(t, 19.8, 20.2)); S(w, { o: k, x: (1 - k) * -24 }); });
    rise(h7, t, 19.95, .5, 34);
    const ck = P(t, 20.55, 20.95);
    S(ctaWrap, { o: C(ck * 3), s: L(.7, 1, eb(ck)) });
    const hover = eo(P(t, 22.3, 22.55));
    const pr = Math.max(0, 1 - Math.abs(t - 22.96) / .1);
    cta.style.transform = `scale(${1 + .03 * hover - .05 * pr})`;
    const pulse = t >= 22.93 ? Math.max(0, 1 - (t - 22.93) / .6) : 0;
    cta.style.boxShadow = `0 0 ${40 + 60 * pulse + 20 * hover}px rgba(94,232,212,${.25 + .35 * pulse + .1 * hover})`;
    rise(foot7, t, 21.0, .45, 16);
  }

  // cursor
  const cu = cursorAt(t);
  if (cu) {
    cursor.style.opacity = cu.o;
    cursor.style.transform = `translate(${cu.x - 9}px,${cu.y - 5}px) scale(${1 - .14 * cu.press})`;
    if (cu.rip !== null) { ripple.style.opacity = .7 * (1 - cu.rip); ripple.style.transform = `translate(${cu.x}px,${cu.y}px) scale(${.2 + 1.1 * eo(cu.rip)})`; }
    else ripple.style.opacity = 0;
  } else { cursor.style.opacity = 0; ripple.style.opacity = 0; }
};
window.render(0);
</script>
