<body>
<div id="stage">
  <div class="grid" id="grid"></div>
  <div class="glow" id="glow"></div>
  <canvas id="field" width="1920" height="1080" style="position:absolute;left:0;top:0"></canvas>

</div>
<script>
window.DURATION = 24.62;
const $s = document.getElementById('stage');
const C = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => C((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eb = x => { const c1 = 1.6, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const L = (a, b, x) => a + (b - a) * x;
function el(tag, cls, css, html, parent) {
  const e = document.createElement(tag);

  if (css) Object.assign(e.style, css);

  (parent || $s).appendChild(e);
  return e;
}
function S(e, o) {
  if (o.o !== undefined) { e.style.opacity = C(o.o); e.style.visibility = o.o <= .001 ? 'hidden' : 'visible'; }
  e.style.transform = `translate(${o.x || 0}px,${o.y || 0}px) scale(${o.sx ?? o.s ?? 1},${o.sy ?? o.s ?? 1}) rotate(${o.r || 0}deg)`;
  if (o.blur !== undefined) e.style.filter = o.blur > .05 ? `blur(${o.blur}px)` : 'none';
}
// fade/rise in at a, fade/lift out ending at b
function show(e, t, a, b, dy = 26, fi = .42, fo = .26) {
  const ki = eo(P(t, a, a + fi)), ko = eio(P(t, b - fo, b));
  S(e, { o: ki * (1 - ko), y: (1 - ki) * dy - ko * 18, blur: ko * 5 });
  return ki * (1 - ko);
}
function pop(e, t, a, d = .42, extra = {}) { const k = P(t, a, a + d); S(e, Object.assign({ o: C(k * 3), s: L(.6, 1, eb(k)) }, extra)); return k; }
function rng(seed) { let s = seed * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
function hash(i, j) { let h = (i * 374761393 + j * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
const fmt = n => Math.round(n).toLocaleString('en-US');

const ICON = {
  check: c => `<svg viewBox="0 0 24 24" width="26" height="26"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="${c}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" width="32" height="32"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="none" stroke="#5EE8D4" stroke-width="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5" fill="none" stroke="#5EE8D4" stroke-width="2"/></svg>`,

};

// ---------- browser factory (hook + callback) ----------
const QUERY = 'operations manager jobs near me';
const TITLES = [QUERY, 'Job search – page 2', 'Supply Chain Lead · Remote', 'Careers | Northwind Health', 'Program Manager – Hybrid', 'Jobs near me', 'Director of Operations', 'Openings | Halcyon Foods', 'Job search – page 3', 'Ops roles within 50 mi', 'Careers | Lakeshore Logistics', 'Saved jobs (14)', 'Job search – page 4', 'Operations Lead – IL', 'Careers | Aster Manufacturing', 'Job alert: 212 new jobs', 'Program Manager jobs', 'Job search – page 5', 'Senior Ops Manager', 'Open roles – Careers'];
const FAV = ['#3B82F6', '#F59E0B', '#8B5CF6', '#10B981', '#EF4444', '#64748B', '#EC4899', '#14B8A6'];
function makeBrowser(parent) {

    const fav = el('div', null, { width: '16px', height: '16px', borderRadius: '4px', background: FAV[i % FAV.length], flex: 'none', color: '#05110F', fontSize: '12px', fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center' }, null, tb);
    const tt = el('div', null, { fontSize: '17px', color: '#AAB2BF', overflow: 'hidden', textOverflow: 'ellipsis', flex: '1 1 auto', minWidth: 0 }, title, tb);
    return { tb, fav, tt };
  });
  B.badge = el('div', 'abs', { right: '18px', top: '13px', height: '34px', minWidth: '52px', padding: '0 12px', borderRadius: '10px', background: 'rgba(94,232,212,.14)', color: '#5EE8D4', fontSize: '20px', fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center', fontVariantNumeric: 'tabular-nums' }, '0', tbar);
  const url = el('div', 'abs', { left: 0, right: 0, top: '60px', height: '58px', background: '#0F141D' }, null, B.br);
  B.urlPill = el('div', 'abs', { left: '24px', right: '24px', top: '11px', height: '36px', borderRadius: '18px', background: '#070A10', display: 'flex', alignItems: 'center', padding: '0 20px', fontSize: '18px', color: '#AAB2BF' }, QUERY, url);
  B.page = el('div', 'abs', { left: 0, right: 0, top: '118px', bottom: 0 }, null, B.br);
  B.skel = []; for (let i = 0; i < 6; i++) B.skel.push(el('div', 'skel', { left: '36px', top: 40 + i * 52 + 'px', height: '22px' }, null, B.page));
  B.jobRows = [];
  for (let i = 0; i < 4; i++) {
    const r = el('div', 'abs', { left: '330px', right: '40px', top: 34 + i * 118 + 'px', height: '100px', borderRadius: '16px', background: 'rgba(255,255,255,.035)' }, null, B.page);
    B.jobRows.push([el('div', 'skel', { left: '28px', top: '22px', height: '22px', background: 'rgba(255,255,255,.14)' }, null, r), el('div', 'skel', { left: '28px', top: '60px', height: '16px' }, null, r), el('div', 'skel', { right: '28px', top: '34px', height: '32px', width: '130px', borderRadius: '16px' }, null, r)]);
  }
  B.mini = el('div', 'abs', { left: '80px', right: '80px', top: '40px', opacity: 0 }, null, B.page);
  [['Operations Manager', 'Northwind Health · Chicago', 94], ['Supply Chain Lead', 'Halcyon Foods · Remote', 89], ['Program Manager', 'Lakeshore Logistics · Hybrid', 83], ['Director of Operations', 'Aster Manufacturing · On-site', 71]].forEach((r, i) => {
    el('div', null, { position: 'relative', height: '96px', marginBottom: '16px', borderRadius: '16px', background: '#0C1018', border: `1.5px solid ${i ? 'rgba(255,255,255,.07)' : 'rgba(94,232,212,.5)'}` },
      `<div style="position:absolute;left:30px;top:18px;font-size:30px;font-weight:650">${r[0]}</div><div style="position:absolute;left:30px;top:58px;font-size:19px;color:#8A93A3">${r[1]}</div><div style="position:absolute;right:30px;top:22px;font-size:44px;font-weight:700;color:#5EE8D4">${r[2]}</div>`, B.mini);
  });

}
function layoutTabs(B, ks, active) {
  const n = ks.reduce((a, b) => a + b, 0);

  B.tabs.forEach(({ tb }, i) => {
    const k = ks[i];
    tb.style.left = x + 'px'; tb.style.width = Math.max(0, w * k - 2) + 'px'; tb.style.opacity = C(k * 1.5);
    tb.style.background = i === active ? '#0F141D' : 'transparent'; tb.style.padding = w < 90 ? '0 10px' : '0 14px';
    x += w * k;
  });
  B.badge.textContent = ks.filter(k => k > .5).length;
  const r = rng(3 + Math.max(0, active));
  B.skel.forEach(s => { s.style.width = 120 + r() * 140 + 'px'; });
  B.jobRows.forEach(([a, b]) => { a.style.width = 280 + r() * 380 + 'px'; b.style.width = 180 + r() * 260 + 'px'; });
}

// ---------- canvas: the field of listings ----------
const cv = document.getElementById('field'), ctx = cv.getContext('2d');
const TW = 1500, TH = 640, GX = 1600, GY = 740, Z_END = .012;
const camZ = t => t < 2.62 ? 1 : Math.exp(L(0, Math.log(Z_END), eio(P(t, 2.62, 4.1))));

const ROW_Y = i => 340 + i * 132;

  for (let j = -ny; j <= ny; j++) for (let i = -nx; i <= nx; i++) {
    if (i === 0 && j === 0 && t < 4.0) continue;
    const x = 960 + i * sx, y = cy + j * sy;
    const fit = hash(i, j) < .022;
    const d = Math.hypot(x - 960, y - 540);
    let a = .9, lit = 0;
    if (R >= 0 && d < R) { if (fit) { fits.push([x, y, i, j, d]); continue; } a = .3; }
    if (R >= 0 && Math.abs(d - R) < 60) lit = 1 - Math.abs(d - R) / 60;
    ctx.globalAlpha = Math.max(a, lit * .9) * fieldA;
    ctx.fillStyle = lit > .05 ? `rgb(${L(27, 94, lit)},${L(35, 232, lit)},${L(50, 212, lit)})` : '#1B2332';
    if (big) {
      ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 22 * zz); ctx.fill();
      ctx.fillStyle = '#07090E'; ctx.fillRect(x - w / 2, y - h / 2, w, 60 * zz);
      ctx.fillStyle = 'rgba(255,255,255,.08)';
      for (let k = 0; k < 4; k++) ctx.fillRect(x - w / 2 + 330 * zz, y - h / 2 + (152 + k * 118) * zz, (500 + hash(i + k, j) * 400) * zz, 22 * zz);
    } else ctx.fillRect(x - w / 2, y - h / 2, w, h);
  }
  ctx.fillStyle = '#5EE8D4'; ctx.shadowColor = 'rgba(94,232,212,.85)'; ctx.shadowBlur = 16;
  for (const [x, y, i, j, d] of fits) {
    let px = x, py = y, s = 1.3, a = 1;
    if (t >= 7.62) {
      const ri = Math.floor(hash(i + 999, j - 77) * 4);
      const tx = 400 + hash(i - 31, j + 513) * 1120, ty = ROW_Y(ri) + 18 + hash(i + 7, j + 7) * 76;
      const ts = 7.66 + hash(i + 3, j - 3) * .3 + Math.min(1, d / 1300) * .35;

      px = L(x, tx, k); py = L(y, ty, k); s = L(1.3, .55, k); a *= 1 - P(t, ts + .5, ts + .72);
      if (a <= 0) continue;
    }
    ctx.globalAlpha = a * (1 - P(t, 12.62, 13.0));
    ctx.fillRect(px - w * s / 2, py - h * s / 2, w * s, h * s);
  }

}

// ---------- corner logo ----------
const corner = logo($s, 26, { left: '48px', top: '40px', zIndex: 5 });

// ---------- 1+2: cold open & pull-back ----------
const gHook = el('div', 'abs', { inset: 0 });
const B1 = makeBrowser(gHook);
B1.urlPill.textContent = '';
const search = el('div', 'abs', { left: '310px', top: '476px', width: '1300px', height: '128px', borderRadius: '64px', background: '#0C1018', border: '1.5px solid rgba(94,232,212,.45)', boxShadow: '0 0 60px rgba(94,232,212,.12), 0 30px 90px rgba(0,0,0,.6)', display: 'flex', alignItems: 'center', padding: '0 40px', gap: '22px', overflow: 'hidden', whiteSpace: 'nowrap' }, null, gHook);
const sIcon = el('div', null, { flex: 'none', display: 'flex' }, ICON.search, search);
const sText = el('div', null, { fontSize: '56px', fontWeight: 500, letterSpacing: '-.01em' }, '', search);
const caret = el('div', null, { width: '4px', height: '64px', background: '#5EE8D4', marginLeft: '-16px', flex: 'none' }, null, search);
const CHAR_T = [...QUERY].map((_, c) => .22 + c * .034);
const TAB_T = TITLES.map((_, i) => i === 0 ? 1.62 : 1.78 + .8 * Math.pow((i - 1) / 18, .6));
const hTabs = el('div', 'abs halo', { left: 0, right: 0, top: '96px', textAlign: 'center', fontSize: '120px', fontWeight: 800, letterSpacing: '-.04em' }, 'twenty tabs.', gHook);
const hJobs = el('div', 'abs halo', { left: 0, right: 0, top: '380px', textAlign: 'center' }, null, gHook);
const jobsBack = el('div', 'abs', { left: '260px', top: '-120px', width: '1400px', height: '560px', background: 'radial-gradient(closest-side,rgba(5,6,12,.92),rgba(5,6,12,.75) 60%,rgba(5,6,12,0))' }, null, hJobs);
const jobsNum = el('div', null, { position: 'relative', fontSize: '190px', fontWeight: 800, letterSpacing: '-.05em', lineHeight: 1, color: '#5EE8D4', fontVariantNumeric: 'tabular-nums' }, '0', hJobs);
const jobsLbl = el('div', null, { position: 'relative', fontSize: '64px', fontWeight: 700, letterSpacing: '-.03em', marginTop: '14px' }, 'open jobs.', hJobs);

// ---------- 3: drop ----------
const gDrop = el('div', 'abs', { inset: 0 });
const e3 = el('div', 'eyebrow halo', null, '01 · upload', gDrop);
const h3 = el('div', 'head halo', null, 'drop in your resume.', gDrop);
const res = el('div', 'abs card', { left: '810px', top: '380px', width: '300px', height: '390px', padding: '32px 28px', borderRadius: '20px', background: '#111620', border: '1.5px solid rgba(94,232,212,.55)', boxShadow: '0 0 80px rgba(94,232,212,.25), 0 30px 90px rgba(0,0,0,.7)' }, null, gDrop);
el('div', null, { fontSize: '25px', fontWeight: 700, marginBottom: '4px' }, 'Sample Candidate', res);
el('div', null, { fontSize: '16px', color: '#8A93A3', marginBottom: '24px' }, 'Operations · 9 years · Chicago', res);
{ const r = rng(7); for (let i = 0; i < 12; i++) el('div', 'line', { width: 40 + r() * 60 + '%', height: '8px', marginBottom: i % 4 === 3 ? '20px' : '12px' }, null, res); }
